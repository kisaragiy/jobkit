name: nightly full gate

# 完整门禁按天跑：push/PR 只跑 fast+safety（见 ci.yml），full 放这里和发布前手动。
# 分层只改「什么时候跑」，不改「跑不跑」——full 永远保留，且只有 full 能当发布凭据。

on:
  schedule:
    # 每天 18:00 UTC = 北京 02:00（避开本地高峰）
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-gate:
    name: full offline kernel gate (windows)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ocr.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-ocr.txt

      - name: Dependency self-check
        run: python scripts/check-deps.py --allow-missing-ocr

      - name: Full kernel gate (all modules + JS checks)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tmp | Out-Null
          & pwsh -NoProfile -File ./scripts/check-kernel.ps1 -Tier full *>&1 | Tee-Object -FilePath tmp/ci-gate-full.log
          $jobkitGateExit = $LASTEXITCODE
          exit $jobkitGateExit

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log-full
          path: |
            tmp/ci-gate-full.log
            tmp/kernel-check-*/**/*.log
          if-no-files-found: ignore
          retention-days: 14
