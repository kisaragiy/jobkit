name: kernel-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: offline kernel gate (windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ocr.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ocr.txt

      - name: Dependency self-check
        # OCR 模型在干净 runner 上可能不可用，按可选处理（0 通过 / 2 有缺失 / 1 出错）
        run: python scripts/check-deps.py --allow-missing-ocr

      - name: Offline kernel gate (1300+ tests + JS checks)
        shell: pwsh
        run: ./scripts/check-kernel.ps1

      - name: Upload gate log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log
          path: tmp/kernel-check-*/**/*.log
          if-no-files-found: ignore
          retention-days: 7
