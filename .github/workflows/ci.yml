name: kernel-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: offline kernel gate (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ocr.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-ocr.txt

      - name: Dependency self-check
        # OCR 模型在干净 runner 上可能不可用，按可选处理（0 通过 / 2 有缺失 / 1 出错）
        run: python scripts/check-deps.py --allow-missing-ocr

      - name: Kernel gate (fast+safety tier)
        # 完整门禁在 nightly-full.yml 跑（-Tier full）与发布前手动跑；这里只跑安全相关层。
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tmp | Out-Null
          & pwsh -NoProfile -File ./scripts/check-kernel.ps1 -Tier safety *>&1 | Tee-Object -FilePath tmp/ci-gate.log
          $jobkitGateExit = $LASTEXITCODE
          exit $jobkitGateExit

      - name: Upload gate log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log
          path: |
            tmp/ci-gate.log
            tmp/kernel-check-*/**/*.log
          if-no-files-found: ignore
          retention-days: 7
